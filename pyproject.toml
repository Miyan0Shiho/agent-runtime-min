[project]
name = "agent-runtime-min"
version = "0.1.0"
description = "arm — an agent runtime built on one rule: what the model can see is already recorded."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.13",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# The browser seam needs a WebSocket client for CDP. Optional because the browser
# is an independent seam rather than part of the main chain: a runtime that never
# drives a browser should not install a WebSocket library to do nothing with it.
browser = [
    "websockets>=13.0",
]

[project.scripts]
arm = "arm.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]
